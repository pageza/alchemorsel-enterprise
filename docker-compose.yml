services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: alchemorsel-postgres
    environment:
      POSTGRES_DB: alchemorsel_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alchemorsel-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: alchemorsel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alchemorsel-network

  # Alchemorsel API Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alchemorsel-api
    environment:
      ALCHEMORSEL_APP_ENVIRONMENT: development
      ALCHEMORSEL_DATABASE_HOST: postgres
      ALCHEMORSEL_DATABASE_PORT: 5432
      ALCHEMORSEL_DATABASE_DATABASE: alchemorsel_dev
      ALCHEMORSEL_DATABASE_USERNAME: postgres
      ALCHEMORSEL_DATABASE_PASSWORD: postgres
      ALCHEMORSEL_REDIS_HOST: redis
      ALCHEMORSEL_REDIS_PORT: 6379
      ALCHEMORSEL_AI_OLLAMA_HOST: http://ollama:11434
      ALCHEMORSEL_AI_PROVIDER: ollama
      ALCHEMORSEL_AUTH_JWT_SECRET: development-secret-key-change-in-production
    ports:
      - "3020:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - alchemorsel-network

  # Alchemorsel Web Frontend (HTMX)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: alchemorsel-web
    environment:
      ALCHEMORSEL_APP_ENVIRONMENT: development
      ALCHEMORSEL_DATABASE_HOST: postgres
      ALCHEMORSEL_DATABASE_PORT: 5432
      ALCHEMORSEL_DATABASE_DATABASE: alchemorsel_dev
      ALCHEMORSEL_DATABASE_USERNAME: postgres
      ALCHEMORSEL_DATABASE_PASSWORD: postgres
      ALCHEMORSEL_REDIS_HOST: redis
      ALCHEMORSEL_REDIS_PORT: 6379
      ALCHEMORSEL_AI_OLLAMA_HOST: http://ollama:11434
      ALCHEMORSEL_AUTH_JWT_SECRET: development-secret-key-change-in-production
      API_URL: http://api:8080
    ports:
      - "3021:8080"
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - alchemorsel-network

  # Ollama AI Service
  ollama:
    image: ollama/ollama:latest
    container_name: alchemorsel-ollama
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=3
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_MAX_QUEUE=10
    networks:
      - alchemorsel-network
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'
        reservations:
          memory: 4G
          cpus: '2'
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
      - "com.alchemorsel.service=ollama"
      - "com.alchemorsel.tier=ai-inference"

volumes:
  postgres_data:
  redis_data:
  ollama_models:

networks:
  alchemorsel-network:
    driver: bridge