services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: alchemorsel-postgres
    environment:
      POSTGRES_DB: alchemorsel_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alchemorsel-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: alchemorsel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alchemorsel-network

  # Alchemorsel API Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alchemorsel-api
    environment:
      ALCHEMORSEL_APP_ENVIRONMENT: development
      ALCHEMORSEL_DATABASE_HOST: postgres
      ALCHEMORSEL_DATABASE_PORT: 5432
      ALCHEMORSEL_DATABASE_DATABASE: alchemorsel_dev
      ALCHEMORSEL_DATABASE_USERNAME: postgres
      ALCHEMORSEL_DATABASE_PASSWORD: postgres
      ALCHEMORSEL_REDIS_HOST: redis
      ALCHEMORSEL_REDIS_PORT: 6379
      ALCHEMORSEL_AI_OLLAMA_HOST: http://172.17.0.1:11434
      ALCHEMORSEL_AI_PROVIDER: ollama
      ALCHEMORSEL_AUTH_JWT_SECRET: development-secret-key-change-in-production
    ports:
      - "0.0.0.0:3020:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/main", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - alchemorsel-network

  # Alchemorsel Web Frontend (HTMX)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: alchemorsel-web
    environment:
      ALCHEMORSEL_APP_ENVIRONMENT: development
      ALCHEMORSEL_DATABASE_HOST: postgres
      ALCHEMORSEL_DATABASE_PORT: 5432
      ALCHEMORSEL_DATABASE_DATABASE: alchemorsel_dev
      ALCHEMORSEL_DATABASE_USERNAME: postgres
      ALCHEMORSEL_DATABASE_PASSWORD: postgres
      ALCHEMORSEL_REDIS_HOST: redis
      ALCHEMORSEL_REDIS_PORT: 6379
      ALCHEMORSEL_AI_OLLAMA_HOST: http://172.17.0.1:11434
      ALCHEMORSEL_AI_CHAT_MODEL: phi3:mini
      ALCHEMORSEL_AI_PROVIDER: ollama
      ALCHEMORSEL_AUTH_JWT_SECRET: development-secret-key-change-in-production
      API_URL: http://api:8080
    ports:
      - "0.0.0.0:3021:8080"
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # healthcheck disabled temporarily for testing startup
    # healthcheck:
    #   test: ["CMD", "/app/main", "-healthcheck"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 40s
    networks:
      - alchemorsel-network

  # Ollama AI Service runs on host - not containerized
  # ollama service removed - using host.docker.internal:11434

volumes:
  postgres_data:
  redis_data:

networks:
  alchemorsel-network:
    driver: bridge