name: CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  GO_VERSION: "1.23"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Run full CI pipeline first
  ci-pipeline:
    name: Full CI Pipeline
    uses: ./.github/workflows/ci-main.yml

  # Build and push container image
  build-image:
    name: Build Container Image
    runs-on: ubuntu-latest
    needs: ci-pipeline
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
      
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployments/docker/Dockerfile.production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Output image
        id: image
        run: echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}" >> $GITHUB_OUTPUT

  # Quality gates for deployment
  quality-gates:
    name: Quality Gates
    needs: [ci-pipeline, build-image]
    uses: ./.github/workflows/quality-gates.yml
    with:
      environment: ${{ github.event.inputs.environment || 'staging' }}
      image_tag: ${{ needs.build-image.outputs.image }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}

  # Deploy to staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-image, quality-gates]
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to staging
        run: |
          echo "Deploying ${{ needs.build-image.outputs.image }} to staging"
          # Add actual deployment logic here
          # This would typically use kubectl, helm, or deployment tools
      
      - name: Run smoke tests
        run: |
          echo "Running smoke tests against staging"
          # Add smoke test logic here
      
      - name: Update deployment status
        run: |
          echo "✅ Staging deployment completed successfully"
          echo "Image: ${{ needs.build-image.outputs.image }}"
          echo "Digest: ${{ needs.build-image.outputs.digest }}"

  # Deploy to production (manual approval required)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-image, quality-gates, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to production
        run: |
          echo "Deploying ${{ needs.build-image.outputs.image }} to production"
          # Add actual deployment logic here
          # This would typically use kubectl, helm, or deployment tools
      
      - name: Run production health checks
        run: |
          echo "Running production health checks"
          # Add health check logic here
      
      - name: Update deployment status
        run: |
          echo "✅ Production deployment completed successfully"
          echo "Image: ${{ needs.build-image.outputs.image }}"
          echo "Digest: ${{ needs.build-image.outputs.digest }}"
      
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## Changes
            Deployed image: `${{ needs.build-image.outputs.image }}`
            
            ## Deployment Details
            - Environment: Production
            - Deployment time: ${{ github.run_started_at }}
            - Deployed by: ${{ github.actor }}
          draft: false
          prerelease: false

  # Deployment summary
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Create deployment summary
        run: |
          echo "# CD Deployment Results" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Image: ${{ needs.build-image.outputs.image }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "- Staging: ${{ needs.deploy-staging.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Production: ${{ needs.deploy-production.result }}" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.deploy-staging.result }}" == "success" ]]; then
            echo "✅ Staging deployment successful" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.deploy-staging.result }}" == "skipped" ]]; then
            echo "⏭️ Staging deployment skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Staging deployment failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
            echo "✅ Production deployment successful" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.deploy-production.result }}" == "skipped" ]]; then
            echo "⏭️ Production deployment skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Production deployment failed" >> $GITHUB_STEP_SUMMARY
          fi