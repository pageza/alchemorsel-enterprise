name: Reusable Build and Test

on:
  workflow_call:
    inputs:
      test_type:
        required: true
        type: string
        description: "Type of tests to run: unit, integration, e2e, security, performance"
      go_version:
        required: false
        type: string
        default: "1.23"
        description: "Go version to use"
      timeout_minutes:
        required: false
        type: number
        default: 10
        description: "Timeout in minutes"
      enable_services:
        required: false
        type: boolean
        default: false
        description: "Enable PostgreSQL and Redis services"
    outputs:
      test_result:
        description: "Test execution result"
        value: ${{ jobs.test-with-services.outputs.result || jobs.test-without-services.outputs.result }}

env:
  GO_VERSION: ${{ inputs.go_version }}

jobs:
  test-with-services:
    name: ${{ inputs.test_type }} Tests (with services)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    if: ${{ inputs.enable_services }}
    outputs:
      result: ${{ steps.test.outcome }}
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
    
    - name: Download dependencies
      run: go mod download
    
    - name: Wait for services
      run: |
        # Wait for PostgreSQL
        until pg_isready -h localhost -p 5432 -U test_user; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done
        
        # Wait for Redis
        until redis-cli -h localhost -p 6379 ping; do
          echo "Waiting for Redis..."
          sleep 2
        done
    
    - name: Run unit tests
      id: test
      if: ${{ inputs.test_type == 'unit' }}
      run: |
        go test -short -v -race -coverprofile=coverage.out ./test/unit/...
    
    - name: Run integration tests
      id: test-integration
      if: ${{ inputs.test_type == 'integration' }}
      run: |
        go test -v -race -tags=integration -run="TestIntegration" -coverprofile=coverage.out ./test/integration/...
      env:
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        POSTGRES_USER: test_user
        POSTGRES_PASSWORD: test_password
        POSTGRES_DB: test_db
        REDIS_HOST: localhost
        REDIS_PORT: 6379
    
    - name: Run e2e tests
      id: test-e2e
      if: ${{ inputs.test_type == 'e2e' }}
      run: |
        go test -v -tags=e2e -run="TestE2E" ./test/e2e/...
    
    - name: Run security tests
      id: test-security
      if: ${{ inputs.test_type == 'security' }}
      run: |
        go test -v -tags=security ./test/security/...
    
    - name: Run performance tests
      id: test-performance
      if: ${{ inputs.test_type == 'performance' }}
      run: |
        go test -v -tags=performance -run="TestPerformance" ./test/performance/...
        go test -bench=. -benchmem -count=3 -run=^$ ./pkg/healthcheck/ | tee benchmark-results.txt
    
    - name: Generate coverage report
      if: ${{ hashFiles('coverage.out') != '' }}
      run: |
        go tool cover -func=coverage.out
        go tool cover -html=coverage.out -o coverage.html
    
    - name: Upload coverage
      if: ${{ hashFiles('coverage.out') != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.test_type }}-coverage
        path: |
          coverage.out
          coverage.html
    
    - name: Upload benchmark results
      if: ${{ inputs.test_type == 'performance' && hashFiles('benchmark-results.txt') != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: benchmark-results.txt

  test-without-services:
    name: ${{ inputs.test_type }} Tests
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    if: ${{ !inputs.enable_services }}
    outputs:
      result: ${{ steps.test.outcome }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
    
    - name: Download dependencies
      run: go mod download
    
    - name: Run unit tests
      id: test
      if: ${{ inputs.test_type == 'unit' }}
      run: |
        go test -short -v -race -coverprofile=coverage.out ./test/unit/...
    
    - name: Run security tests
      id: test-security
      if: ${{ inputs.test_type == 'security' }}
      run: |
        go test -v -tags=security ./test/security/...
    
    - name: Run performance tests
      id: test-performance
      if: ${{ inputs.test_type == 'performance' }}
      run: |
        go test -v -tags=performance -run="TestPerformance" ./test/performance/...
        go test -bench=. -benchmem -count=3 -run=^$ ./pkg/healthcheck/ | tee benchmark-results.txt
    
    - name: Generate coverage report
      if: ${{ hashFiles('coverage.out') != '' }}
      run: |
        go tool cover -func=coverage.out
        go tool cover -html=coverage.out -o coverage.html
    
    - name: Upload coverage
      if: ${{ hashFiles('coverage.out') != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.test_type }}-coverage
        path: |
          coverage.out
          coverage.html
    
    - name: Upload benchmark results
      if: ${{ inputs.test_type == 'performance' && hashFiles('benchmark-results.txt') != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: benchmark-results.txt