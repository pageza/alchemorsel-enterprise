name: Continuous Deployment - Simplified

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip integration tests'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Deploy to staging (Docker Compose on staging server)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.yourdomain.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment artifacts
        run: |
          # Create deployment package
          mkdir -p deploy
          cp docker-compose.yml deploy/
          cp docker-compose.prod.yml deploy/
          cp -r config deploy/
          
          # Create production environment file template
          cat > deploy/.env.production << EOF
          # Production Configuration
          POSTGRES_USER=\${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=\${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=alchemorsel_production
          REDIS_PASSWORD=\${{ secrets.REDIS_PASSWORD }}
          
          # Application Settings
          GO_ENV=production
          PORT=80
          API_PORT=8080
          
          # Security
          SESSION_SECRET=\${{ secrets.SESSION_SECRET }}
          CSRF_SECRET=\${{ secrets.CSRF_SECRET }}
          
          # External Services
          OLLAMA_HOST=\${{ secrets.OLLAMA_HOST }}
          OLLAMA_PORT=11434
          EOF

      - name: Deploy via SSH (Staging)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          script: |
            # Create deployment directory
            mkdir -p ~/alchemorsel-deployment
            cd ~/alchemorsel-deployment
            
            # Backup current deployment
            if [ -f docker-compose.yml ]; then
              echo "Creating backup..."
              cp -r . ../alchemorsel-backup-$(date +%Y%m%d-%H%M%S)
            fi
            
            # Download deployment artifacts (you'd typically use SCP or similar)
            # For now, we'll clone the repo (replace with artifact download in production)
            git clone --depth 1 --branch ${{ github.ref_name }} ${{ github.repository_url }} temp-repo
            cp temp-repo/docker-compose.yml .
            cp temp-repo/docker-compose.prod.yml .
            cp -r temp-repo/config .
            rm -rf temp-repo
            
            # Stop existing services
            docker compose -f docker-compose.yml -f docker-compose.prod.yml down
            
            # Pull latest images
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            
            # Start services
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            
            # Wait for services
            echo "Waiting for services to start..."
            sleep 30
            
            # Health check
            if curl -f http://localhost/health; then
              echo "✅ Deployment successful!"
            else
              echo "❌ Health check failed!"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml logs
              exit 1
            fi

      - name: Run staging smoke tests
        if: ${{ !inputs.skip_tests }}
        run: |
          # Simple smoke tests
          sleep 60  # Give services time to fully start
          
          # Test basic endpoints (replace with your staging URL)
          STAGING_URL="${{ secrets.STAGING_URL || 'http://your-staging-server' }}"
          
          echo "Running smoke tests against $STAGING_URL"
          
          # Health check
          curl -f "$STAGING_URL/health" || exit 1
          echo "✅ Health check passed"
          
          # API health check  
          curl -f "$STAGING_URL/api/health" || exit 1
          echo "✅ API health check passed"
          
          # Basic page load
          curl -f "$STAGING_URL/" | grep -q "Alchemorsel" || exit 1
          echo "✅ Home page loads correctly"

  # Production deployment (manual approval required)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://yourdomain.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          script: |
            # Create deployment directory
            mkdir -p ~/alchemorsel-production
            cd ~/alchemorsel-production
            
            # Create backup
            if [ -f docker-compose.yml ]; then
              echo "Creating production backup..."
              cp -r . ../alchemorsel-prod-backup-$(date +%Y%m%d-%H%M%S)
            fi
            
            # Download deployment files
            git clone --depth 1 --branch ${{ github.ref_name }} ${{ github.repository_url }} temp-repo
            cp temp-repo/docker-compose.yml .
            cp temp-repo/docker-compose.prod.yml .
            cp -r temp-repo/config .
            rm -rf temp-repo
            
            # Rolling deployment (zero-downtime)
            echo "Starting rolling deployment..."
            
            # Scale up new instances
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --scale web=2 --scale api=2
            
            # Wait for new instances
            sleep 60
            
            # Health check new instances
            if curl -f http://localhost/health; then
              echo "✅ New instances healthy, completing deployment"
              # Scale down old instances (Docker Compose will handle this automatically)
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            else
              echo "❌ New instances failed health check, rolling back"
              # Rollback logic here
              exit 1
            fi

      - name: Production health verification
        run: |
          sleep 30
          
          PRODUCTION_URL="${{ secrets.PRODUCTION_URL || 'https://yourdomain.com' }}"
          
          echo "Verifying production deployment at $PRODUCTION_URL"
          
          # Comprehensive health checks
          curl -f "$PRODUCTION_URL/health" || exit 1
          curl -f "$PRODUCTION_URL/api/health" || exit 1
          curl -f "$PRODUCTION_URL/" | grep -q "Alchemorsel" || exit 1
          
          echo "✅ Production deployment verified!"

  # Rollback capability
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure() && (needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure')
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Rollback via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ github.event.inputs.environment == 'production' && secrets.PRODUCTION_HOST || secrets.STAGING_HOST }}
          username: ${{ github.event.inputs.environment == 'production' && secrets.PRODUCTION_USER || secrets.STAGING_USER }}
          key: ${{ github.event.inputs.environment == 'production' && secrets.PRODUCTION_SSH_KEY || secrets.STAGING_SSH_KEY }}
          port: 22
          script: |
            echo "🚨 Rolling back deployment..."
            
            # Find latest backup
            BACKUP_DIR=$(ls -td ~/alchemorsel-backup-* | head -1)
            
            if [ -n "$BACKUP_DIR" ] && [ -d "$BACKUP_DIR" ]; then
              echo "Rolling back to: $BACKUP_DIR"
              
              cd ~/alchemorsel-deployment
              docker compose down
              
              # Restore backup
              cp -r "$BACKUP_DIR"/* .
              
              # Start previous version
              docker compose up -d
              
              echo "✅ Rollback completed"
            else
              echo "❌ No backup found for rollback"
              exit 1
            fi

  # Notification
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Determine deployment status
        id: status
        run: |
          if [[ "${{ needs.deploy-staging.result }}" == "success" ]]; then
            if [[ "${{ needs.deploy-production.result }}" == "success" || "${{ needs.deploy-production.result }}" == "skipped" ]]; then
              echo "status=success" >> $GITHUB_OUTPUT
              echo "message=✅ Deployment completed successfully" >> $GITHUB_OUTPUT
            else
              echo "status=partial" >> $GITHUB_OUTPUT
              echo "message=⚠️ Staging deployed, production failed" >> $GITHUB_OUTPUT
            fi
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=❌ Deployment failed" >> $GITHUB_OUTPUT
          fi

      - name: Show deployment status
        run: |
          echo "Deployment status: ${{ steps.status.outputs.status }}"
          echo "Message: ${{ steps.status.outputs.message }}"
          echo "Staging: ${{ needs.deploy-staging.result }}"
          echo "Production: ${{ needs.deploy-production.result }}"