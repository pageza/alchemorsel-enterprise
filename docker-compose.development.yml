# version: '3.8' # Removed obsolete version attribute

# Alchemorsel v3 - Containerized Development Environment
# Addresses user request: "move this whole project inside of a container to be able to cut out these version issues"
# This completely containerizes the development environment with Go 1.23, all tools, and dependencies

services:
  # Development Environment Container
  dev-environment:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    container_name: alchemorsel-dev-env
    volumes:
      # Mount source code for live editing from host
      - .:/workspace
      # Mount Docker socket to allow docker commands from within container
      - /var/run/docker.sock:/var/run/docker.sock
      # Go module cache for faster builds
      - go-mod-cache:/go/pkg/mod
      # Build cache for faster compilation
      - go-build-cache:/root/.cache/go-build
    working_dir: /workspace
    environment:
      # Development configuration
      CGO_ENABLED: "1"
      GOOS: linux
      GOARCH: amd64
      GO111MODULE: "on"
      
      # Application configuration
      APP_ENVIRONMENT: development
      APP_DEBUG: "true"
      APP_LOG_LEVEL: debug
      
      # Database configuration (connects to containerized PostgreSQL)
      ALCHEMORSEL_DATABASE_HOST: postgres
      ALCHEMORSEL_DATABASE_PORT: 5432
      ALCHEMORSEL_DATABASE_DATABASE: alchemorsel_dev
      ALCHEMORSEL_DATABASE_USERNAME: postgres
      ALCHEMORSEL_DATABASE_PASSWORD: postgres
      ALCHEMORSEL_DATABASE_SSLMODE: disable
      
      # Redis configuration
      ALCHEMORSEL_REDIS_HOST: redis
      ALCHEMORSEL_REDIS_PORT: 6379
      
      # API communication (internal container networking)
      API_URL: http://localhost:8080
      
      # Development ports
      PORT: 8080
      ALCHEMORSEL_MONITORING_METRICS_PORT: 3012
      
      # AI configuration
      ALCHEMORSEL_AI_PROVIDER: ollama
      ALCHEMORSEL_OLLAMA_HOST: http://ollama:11434
      ALCHEMORSEL_OLLAMA_MODEL: mistral:7b
    ports:
      # Development server ports
      - "8080:8080"   # API server
      - "8081:8081"   # Web server  
      - "3012:3012"   # Metrics
      - "2345:2345"   # Debugger (dlv)
      - "6060:6060"   # pprof profiler
      - "35729:35729" # Live reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alchemorsel-dev-network
    stdin_open: true
    tty: true
    restart: unless-stopped
    command: /bin/bash

  # PostgreSQL Database (same as production)
  postgres:
    image: postgres:15-alpine
    container_name: alchemorsel-dev-postgres
    environment:
      POSTGRES_DB: alchemorsel_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alchemorsel_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - alchemorsel-dev-network

  # Redis Cache (same as production)
  redis:
    image: redis:7-alpine
    container_name: alchemorsel-dev-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - alchemorsel-dev-network

  # Ollama AI Service (commented out for initial testing)
  # ollama:
  #   build:
  #     context: .
  #     dockerfile: deployments/ollama/Dockerfile
  #   container_name: alchemorsel-dev-ollama
  #   environment:
  #     OLLAMA_HOST: 0.0.0.0
  #     OLLAMA_ORIGINS: "*"
  #     OLLAMA_DEFAULT_MODEL: mistral:7b
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_dev_models:/root/.ollama
  #   networks:
  #     - alchemorsel-dev-network
  #   healthcheck:
  #     test: ["CMD", "/health/healthcheck.sh"]
  #     interval: 30s
  #     timeout: 15s
  #     retries: 3
  #     start_period: 180s
  #   restart: unless-stopped

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  ollama_dev_models:
    driver: local
  go-mod-cache:
    driver: local
  go-build-cache:
    driver: local

networks:
  alchemorsel-dev-network:
    driver: bridge
    name: alchemorsel-dev