{{if .Recipes}}
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
  {{range .Recipes}}
  <div class="bg-white rounded-lg shadow-md p-4 hover:shadow-lg transition-shadow">
    <h3 class="font-semibold text-lg mb-2">{{.Title}}</h3>
    <p class="text-gray-600 text-sm mb-3">{{truncate .Description 100}}</p>
    <div class="flex justify-between items-center text-sm text-gray-500">
      <span>{{.Difficulty}}</span>
      <span>{{add .PrepTimeMinutes .CookTimeMinutes}} min</span>
    </div>
    <div class="mt-3 flex justify-between items-center">
      <a href="/recipes/{{.ID}}" class="text-blue-600 hover:text-blue-800 font-medium">View Recipe</a>
      <div class="flex items-center space-x-2">
        <span class="flex items-center">
          <svg class="w-4 h-4 text-yellow-500" fill="currentColor" viewBox="0 0 20 20">
            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
          </svg>
          <span class="ml-1">{{.AverageRating}}</span>
        </span>
        <span class="flex items-center">
          <svg class="w-4 h-4 text-red-500" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"/>
          </svg>
          <span class="ml-1">{{.LikesCount}}</span>
        </span>
      </div>
    </div>
  </div>
  {{end}}
</div>
{{else}}
<div class="text-center py-8">
  <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
  </svg>
  <h3 class="mt-4 text-lg font-medium text-gray-900">No recipes yet</h3>
  <p class="mt-2 text-gray-500">Get started by exploring our recipe collection!</p>
  <div class="mt-6">
    <a href="/recipes" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
      Browse Recipes
    </a>
  </div>
</div>
{{end}}
