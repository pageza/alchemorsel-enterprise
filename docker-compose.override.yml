# Docker Compose override for development with AI features
# This file extends docker-compose.yml with development-specific settings

services:
  # API service with AI development configuration
  api:
    environment:
      # Enhanced AI configuration for development
      ALCHEMORSEL_AI_PROVIDER: ollama
      ALCHEMORSEL_AI_OLLAMA_HOST: http://host.docker.internal:11434
      ALCHEMORSEL_AI_OLLAMA_MODEL: phi3:mini
      ALCHEMORSEL_AI_OLLAMA_FALLBACK_MODEL: phi3:mini
      ALCHEMORSEL_AI_CHAT_MODEL: phi3:mini
      ALCHEMORSEL_AI_RECIPE_MODEL: phi3:mini
      ALCHEMORSEL_AI_CODE_MODEL: phi3:mini
      ALCHEMORSEL_AI_HELP_MODEL: phi3:mini
      ALCHEMORSEL_AI_MODEL_WARMUP_ENABLED: true
      ALCHEMORSEL_AI_RESPONSE_STREAMING: true
      ALCHEMORSEL_AI_ENABLE_CACHE: true
      ALCHEMORSEL_AI_CACHE_TTL: 1h
      ALCHEMORSEL_AI_CACHE_MAX_SIZE: 1000
      ALCHEMORSEL_AI_QUALITY_THRESHOLD: 0.8
      ALCHEMORSEL_AI_MAX_RESPONSE_TIME: 10s
      ALCHEMORSEL_AI_RETRY_ATTEMPTS: 3
      # Enable debug logging for AI components
      ALCHEMORSEL_APP_LOG_LEVEL: debug

  # Web service with AI development configuration
  web:
    environment:
      # Same AI configuration for web frontend
      ALCHEMORSEL_AI_PROVIDER: ollama
      ALCHEMORSEL_AI_OLLAMA_HOST: http://host.docker.internal:11434
      ALCHEMORSEL_AI_RESPONSE_STREAMING: true
      ALCHEMORSEL_APP_LOG_LEVEL: debug

  # Development monitoring service (Prometheus for metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: alchemorsel-prometheus-dev
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--log.level=debug'
    ports:
      - "9090:9090"
    volumes:
      - prometheus_config:/etc/prometheus
      - prometheus_data:/prometheus
    networks:
      - alchemorsel-network
    profiles:
      - monitoring

volumes:
  prometheus_config:
  prometheus_data:

# Development-specific configurations
x-development-notes: |
  Development AI Setup Instructions:
  
  1. Start the stack:
     docker compose up -d
  
  2. Access services:
     - Web UI: http://localhost:3021
     - API: http://localhost:3020
     - Host Ollama: http://localhost:11434
     - Prometheus: http://localhost:9090 (with monitoring profile)
  
  Resource Requirements with Host Ollama:
  - RAM: ~6GB for Phi models
  - Disk: ~8GB for model storage
  - CPU: 2+ cores sufficient
  
  Model Performance (approximate):
  - phi3:mini: ~25 tokens/sec, 2.3GB RAM